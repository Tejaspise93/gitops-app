name: CI - Build, Test, Dockerize, gitops-config update

on:
    push:
        branches:
            - main
        # trigger the workflow only when files in the src directory or pom.xml are changed
        paths:
            - "src/**"
            - "pom.xml"
    workflow_dispatch: {} # manual trigger

env:
    IMAGE_NAME: tejaspise/gitops-app

jobs:
    build-test:
        name: Build & Test
        runs-on: ubuntu-latest

        outputs:
            image_tag: ${{ steps.vars.outputs.image_tag }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
                  cache: maven

            - name: Set image tag variable
              id: vars # id is required to reference outputs from this step
              run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

            - name: Maven Build (skip tests)
              run: mvn -B clean package -DskipTests

            - name: Upload build JAR
              uses: actions/upload-artifact@v7
              with:
                  name: gitops-app-jar-${{ github.sha }}
                  path: target/*.jar
                  retention-days: 5

            - name: Run Unit Tests
              run: mvn -B test

            - name: Publish Test Report
              uses: dorny/test-reporter@v3
              if: always()
              with:
                  name: Maven Test Results
                  path: "target/surefire-reports/*.xml"
                  reporter: java-junit
                  fail-on-error: true

            - name: Upload Test Results (raw XML)
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: surefire-reports-${{ github.sha }}
                  path: target/surefire-reports/
                  retention-days: 10

    docker-build-push:
        name: Docker Build, Scan & Push
        needs: build-test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: false # will be pushing image in the next step, after scanning it
                  load: True  # load the image into the local docker cache, so that it can be scanned in the next step
                  tags: |
                      ${{ env.IMAGE_NAME }}:${{ needs.build-test.outputs.image_tag }}
                      ${{ env.IMAGE_NAME }}:latest
                  labels: |
                      build.run_number=${{ github.run_number }}
                      git.commit=${{ github.sha }}
                      git.branch=${{ github.ref_name }}
                  cache-from:
                      type=gha # github actions cache, as runners are ephemeral they don't have a persistent docker cache
                      #   this solves that issue by caching the layers in github actions cache
                  cache-to: type=gha,mode=max # same as above, but this is the cache destination, so that the next run can use it
            
            - name: Trivy Scan - OS packages (blocking gate)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ env.IMAGE_NAME }}:${{ needs.build-test.outputs.image_tag }}
                vuln-type: 'os'
                severity: 'CRITICAL,HIGH'
                exit-code: '1' # if vulnerabilities are found, exit with code 1 to fail the job
                format: 'table'

            - name: Trivy Scan - Application dependencies (report only, non-blocking gate)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ env.IMAGE_NAME }}:${{ needs.build-test.outputs.image_tag }}
                vuln-type: 'application'
                severity: 'MEDIUM,HIGH,CRITICAL'
                exit-code: '0' # always succeed, but report of vulnerabilities uploaded to github actions artifacts
                format: 'table'
                trivyignores: '.trivyignore'
                output: 'trivy-library-report.txt'
          
            - name: Upload Trivy Report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: trivy-library-report-${{ needs.build-test.outputs.image_tag }}
                  path: trivy-library-report.txt
                  retention-days: 10
            
            - name: Push image to Docker Hub
              run: |
                  docker push ${{ env.IMAGE_NAME }}:${{ needs.build-test.outputs.image_tag }}
                  docker push ${{ env.IMAGE_NAME }}:latest


    update-gitops-config:
        name: Update GitOps Config Repo
        needs: [build-test, docker-build-push]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout gitops-config repo
              uses: actions/checkout@v6
              with:
                  repository: Tejaspise93/gitops-config
                  token: ${{ secrets.GH_PAT }}
                  path: gitops-config

            - name: Install yq
              run: |
                  sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
                  sudo chmod +x /usr/local/bin/yq

            - name: Update image tag
              working-directory: gitops-config
              run: |
                  yq e '.image.tag = "${{ needs.build-test.outputs.image_tag }}"' -i environments/dev/values.yaml
                  echo "Updated environments/dev/values.yaml:"
                  cat environments/dev/values.yaml

            - name: Commit and push
              working-directory: gitops-config
              run: |
                  git config user.email "${{ vars.GIT_USER_EMAIL }}"
                  git config user.name "${{ vars.GIT_USER_NAME }}"
                  git add environments/dev/values.yaml
                  git commit -m "ci: update gitops-app image tag to ${{ needs.build-test.outputs.image_tag }} [run #${{ github.run_number }}]"
                  git push origin main
