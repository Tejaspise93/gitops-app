name: CI - Build, Test, Dockerize

on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # manual trigger

env:
  IMAGE_NAME: tejaspise/gitops-app

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set image tag variable
        id: vars  # id is required to reference outputs from this step
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Maven Build (skip tests)
        run: mvn -B clean package -DskipTests

      - name: Upload build JAR
        uses: actions/upload-artifact@v4
        with:
          name: gitops-app-jar-${{ github.sha }}
          path: target/*.jar
          retention-days: 5

      - name: Run Unit Tests
        run: mvn -B test

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Test Results
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: true

      - name: Upload Test Results (raw XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: target/surefire-reports/
          retention-days: 10

  docker-build-push:
    name: Docker Build & Push
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.build-test.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            build.run_number=${{ github.run_number }}
            git.commit=${{ github.sha }}
            git.branch=${{ github.ref_name }}
          cache-from: type=gha  # github actions cache, as runners are ephemeral they don't have a persistent docker cache 
                                #   this solves that issue by caching the layers in github actions cache
          cache-to: type=gha,mode=max # same as above, but this is the cache destination, so that the next run can use it