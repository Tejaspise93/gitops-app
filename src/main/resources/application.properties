# =============================================================================
# application.properties
# Spring Boot's main configuration file.
# Loaded automatically from the classpath at startup — no extra wiring needed.
#
# In a real GitOps pipeline, environment-specific values (DB URLs, secrets)
# would NOT live here. They would be injected via:
#   - Kubernetes ConfigMaps (non-sensitive config)
#   - Kubernetes Secrets (sensitive config, ideally backed by Vault or AWS SSM)
#   - Helm values.yaml (templated into ConfigMaps/Secrets at deploy time)
# This file should only contain safe, environment-agnostic defaults.
# =============================================================================


# -----------------------------------------------------------------------------
# APPLICATION IDENTITY
# Used by /actuator/info to expose build metadata.
# Useful for confirming which version is running after a deployment.
# -----------------------------------------------------------------------------
spring.application.name=gitops-app


# -----------------------------------------------------------------------------
# SERVER CONFIGURATION
# Explicitly declaring the port even though 8080 is the default.
# Explicit is better than implicit — makes the config auditable and
# prevents surprises if the Spring Boot default ever changes.
# This must match: EXPOSE 8080 in Dockerfile and containerPort in K8s manifests.
# -----------------------------------------------------------------------------
server.port=8080


# -----------------------------------------------------------------------------
# ACTUATOR ENDPOINTS
#
# management.endpoints.web.exposure.include:
#   Controls which actuator endpoints are exposed over HTTP.
#   '*' exposes all endpoints. In production, lock this down to only
#   what your monitoring stack needs:
#     health,info,prometheus
#   We use '*' here for development visibility — tighten for production.
#
# management.endpoint.health.show-details:
#   'always' makes /actuator/health return full detail on every component
#   (disk, ping, etc.). Options: never | when-authorized | always
#   For production, use 'when-authorized' so health details aren't
#   publicly visible to unauthenticated callers.
#
# management.metrics.export.prometheus.enabled:
#   Explicitly enables the Prometheus metrics export.
#   Even though micrometer-registry-prometheus on the classpath triggers
#   auto-configuration, being explicit here documents the intent clearly
#   and makes it easy to disable per environment if needed.
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true


# -----------------------------------------------------------------------------
# PROMETHEUS METRICS BASE PATH
#
# By default, all actuator endpoints are under /actuator.
# So Prometheus scrapes at: http://<host>:8080/actuator/prometheus
#
# In Phase 2, your Prometheus scrape config (prometheus.yml) will need:
#   scrape_configs:
#     - job_name: 'gitops-app'
#       metrics_path: '/actuator/prometheus'
#       static_configs:
#         - targets: ['<host>:8080']
#
# Keeping the default base path avoids confusion when referencing
# Spring Boot documentation and community resources.
# -----------------------------------------------------------------------------
management.endpoints.web.base-path=/actuator


# -----------------------------------------------------------------------------
# LOGGING
#
# Root log level set to INFO — the right default for production.
# DEBUG would flood logs with Spring internals (bean wiring, HTTP details)
# which adds noise and cost in a real observability stack (e.g., Loki, ELK).
#
# In Phase 2 (observability), structured JSON logging is recommended.
# Add logstash-logback-encoder to pom.xml and configure logback-spring.xml
# to emit JSON so your log aggregator (Loki/Elasticsearch) can parse fields
# without regex.
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.gitops=INFO


# -----------------------------------------------------------------------------
# JACKSON (JSON SERIALIZATION)
#
# FAIL_ON_UNKNOWN_PROPERTIES=false:
#   If this app ever consumes JSON from an external API and that API adds
#   new fields in the future, Jackson will silently ignore them instead of
#   throwing an UnrecognizedPropertyException. Defensive and forward-compatible.
#
# serialization.indent-output=true (dev-friendly):
#   Pretty-prints JSON responses. Makes manual curl/Postman testing readable.
#   Disable in production if response payload size is a concern.
# -----------------------------------------------------------------------------
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.indent-output=true


# Expose build information at /actuator/info
# Spring Boot reads META-INF/build-info.properties (generated by Maven
# build-info goal) and serves it here. Useful for confirming the deployed
# version without hitting the /hello endpoint.
management.info.build.enabled=true
management.info.env.enabled=true
info.app.description=GitOps + Observability Portfolio Project